[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanowrap"
version = "0.1.0"
description = "The programs already on your computer, with buttons. No code, no flags, no manual."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["cli", "no-code", "gui", "drag-and-drop", "ffmpeg", "offline"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
  "Topic :: Multimedia :: Video",
]
# Nothing is required, on any operating system. It drives the programs already installed and says plainly which are missing.
dependencies = []

[project.scripts]
nanowrap = "nanowrap.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanowrap"

[tool.setuptools]
packages = ["nanowrap"]
include-package-data = true

[tool.setuptools.package-data]
nanowrap = ["web/*"]
